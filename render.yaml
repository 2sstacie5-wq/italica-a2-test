services:
  - type: web
    name: italica-b1-test
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: italica-b1-data
      mountPath: /data
      sizeGB: 1
